[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.39.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Alloy Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/alloy-rs/alloy-evm"
repository = "https://github.com/alloy-rs/alloy-evm"
exclude = ["benches/", "tests/"]

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"
unnameable-types = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "allow"
redundant-clone = "warn"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.dependencies]
alloy-evm = { version = "0.39.0", path = "crates/evm", default-features = false }

# alloy
alloy-eip2124 = { version = "0.2", default-features = false }
alloy-chains = { version = "0.2.0", default-features = false }
alloy-eips = { version = "2.0.0", default-features = false }
alloy-consensus = { version = "2.0.0", default-features = false }
alloy-primitives = { version = "1.0.0", default-features = false }
alloy-sol-types = { version = "1.0.0", default-features = false }
alloy-hardforks = { version = "0.4.7" }
alloy-rpc-types-eth = { version = "2.0.0", default-features = false }
alloy-rpc-types-engine = { version = "2.0.0", default-features = false }

# revm
revm = { version = "43.0.0", default-features = false }

# tracing
tracing = { version = "0.1", default-features = false }

# misc
auto_impl = "1"
derive_more = { version = "2", default-features = false, features = ["full"] }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.0", default-features = false }
serde_json = "1"
test-case = "3"

# reth-v2.8.1 migration: the original pointed at `github.com/0glabs/revm` rev `968f6c5f` (the
# 0G stateful precompiles on revm 27) and also patched `op-revm`. That commit's 0G files are
# identical to revm `57d41378`, whose replay on revm v120 is `eeff0073` in
# `github.com/0gfoundation/revm`, so the rev maps there. alloy-evm 0.39 no longer depends on
# `op-revm`, so its two entries are dropped.
[patch.crates-io]
# reth-v2.8.1 migration: `3909a40` (the merge of upstream 0.21.0 into the stateful precompile
# branch) switched this patch from the git rev to a local `../revm` checkout. Its other extra
# changes adapted upstream 0.21.0 code that the v0.39.0 base already has, so they are part of the
# previous commit; this switch is all that is left and is kept as is. Like the original, this
# commit only builds with a revm checkout at `../revm`; the next commit points back at git.
# reth-v2.8.1 migration: `b2c2f9c` pinned `71cbb675` (revm merge PR #2, same tree as
# `c29ad165`), whose replay on revm v120 is `6726ca5c`; `op-revm` entries dropped as above.
revm = { git = "https://github.com/0gfoundation/revm", rev = "6726ca5c26a46f9493c628518cb9b9e11f13613d" }

# revm = { path = "../revm/crates/revm" }
